
name: Deploy Multiple Post Reads

on:
  push:
    branches:
      - main
      - 'post-read-*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Deploy main → root
      - name: Deploy main
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true

      # Deploy individual post-read branches
      - name: Deploy Post Reads
        if: startsWith(github.ref, 'refs/heads/post-read-')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          destination_dir: ${{ github.ref_name }}
          keep_files: true
